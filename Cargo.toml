[package]
name = "adaptive-log"
version = "0.2.1"
edition = "2021"
rust-version = "1.71"
description = "Auto-detecting logger: env_logger for standalone, systemd journal when running as a service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devtamer/adaptive-logger"
keywords = ["logging", "systemd", "journal", "env-logger", "tracing"]
categories = ["development-tools::debugging"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-journald"]

[dependencies]
log = "0.4"
env_logger = "0.11"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
systemd-journal-logger = "2.2"
tracing-journald = { version = "0.3", optional = true }

[[example]]
name = "tracing_init"
required-features = ["tracing"]
